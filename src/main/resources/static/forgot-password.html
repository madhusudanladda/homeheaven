<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Reset Password - Home Heaven</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .reset-container { max-width: 480px; width: 100%; }
    .reset-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .reset-header {
      background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
      padding: 40px 32px;
      color: white;
      text-align: center;
    }
    .logo-icon {
      width: 72px;
      height: 72px;
      background: rgba(255,255,255,0.2);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 16px;
      font-size: 36px;
    }

    .reset-body { padding: 40px 32px; }

    .info-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      color: #991b1b;
    }

    .form-group { margin-bottom: 20px; }
    .form-label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-wrapper { position: relative; }
    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #737373;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      border: 1.5px solid #e5e5e5;
      border-radius: 10px;
      font-size: 15px;
      transition: 0.2s;
    }
    .form-input:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220,38,38,0.1);
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
      border: none;
      color: white;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
    }
    .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }

    .back-link {
      padding: 24px;
      background: #fafafa;
      text-align: center;
      border-top: 1px solid #e5e5e5;
    }
    .back-link a { color: #dc2626; text-decoration: none; font-weight: 600; }
  </style>
</head>

<body>
  <div class="reset-container">
    <div class="reset-card">

      <div class="reset-header">
        <div class="logo-icon"><i class="fa-solid fa-key"></i></div>
        <h1>Reset Password</h1>
        <p>Recover your HomeHeaven account</p>
      </div>

      <div class="reset-body">
        <div class="info-box">
          <i class="fa-solid fa-circle-info"></i>
          <span>Enter your email, 4-digit PIN, and new password.</span>
        </div>

        <form id="forgotForm">

          <div class="form-group">
            <label class="form-label">Email</label>
            <div class="input-wrapper">
              <input type="email" name="email" class="form-input" required>
              <i class="fa-solid fa-envelope input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">4-Digit PIN</label>
            <div class="input-wrapper">
              <input type="text" name="pin" maxlength="4" class="form-input" required>
              <i class="fa-solid fa-shield-halved input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">New Password</label>
            <div class="input-wrapper">
              <input type="password" name="newPassword" class="form-input" required>
              <i class="fa-solid fa-lock input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <div class="input-wrapper">
              <input type="password" name="confirmPassword" class="form-input" required>
              <i class="fa-solid fa-lock input-icon"></i>
            </div>
          </div>

          <button type="submit" class="submit-btn">
            <i class="fa-solid fa-rotate"></i> Reset Password
          </button>

          <div id="msg" class="message"></div>
        </form>
      </div>

      <div class="back-link">
        <a href="/login.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
      </div>

    </div>
  </div>

<script>
function showMessage(text, success) {
  const msg = document.getElementById('msg');
  msg.className = "message " + (success ? "success" : "error");
  msg.innerHTML = text;
  msg.style.display = "block";
}

document.getElementById('forgotForm').onsubmit = async (e) => {
  e.preventDefault();

  const btn = e.target.querySelector("button");
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resetting...';

  const email = e.target.email.value.trim();
  const pin = e.target.pin.value.trim();
  const newPassword = e.target.newPassword.value;
  const confirmPassword = e.target.confirmPassword.value;

  if (!/^\d{4}$/.test(pin)) {
    showMessage("❌ PIN must be 4 digits", false);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Reset Password';
    return;
  }

  if (newPassword !== confirmPassword) {
    showMessage("❌ Passwords do not match", false);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Reset Password';
    return;
  }

  try {
    const res = await fetch("/auth/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, pin, newPassword, confirmPassword })
    });

    const text = await res.text();

    if (res.ok) {
      showMessage("✅ " + text + " Redirecting...", true);
      setTimeout(() => window.location = "/login.html", 2000);
    } else {
      showMessage("❌ " + text, false);
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Reset Password';
    }

  } catch (err) {
    showMessage("❌ Error. Try again.", false);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Reset Password';
  }
};
</script>

</body>
</html>
