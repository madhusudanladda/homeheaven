<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Register - Home Heaven</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:'Inter',sans-serif;
      background:linear-gradient(135deg,#dc2626,#ef4444);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }
    .register-container{max-width:540px;width:100%;}
    .register-card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,0.3);
    }
    .register-header{
      background:linear-gradient(135deg,#dc2626,#ef4444);
      padding:40px 32px;
      color:white;
      text-align:center;
    }
    .logo-icon{
      width:72px;height:72px;
      background:rgba(255,255,255,0.2);
      border-radius:16px;
      display:flex;
      justify-content:center;
      align-items:center;
      margin:0 auto 16px;
      font-size:36px;
    }
    .register-body{padding:40px 32px;}
    .form-group{margin-bottom:20px;}
    .form-label{font-size:14px;font-weight:600;margin-bottom:6px;display:block;}
    .input-wrapper{position:relative;}
    .input-icon{
      position:absolute;left:16px;top:50%;
      transform:translateY(-50%);
      color:#737373;
    }
    .form-input{
      width:100%;padding:14px 16px 14px 48px;
      border:1.5px solid #e5e5e5;
      border-radius:10px;
      font-size:15px;
      transition:0.2s;
    }
    .form-input:focus{
      border-color:#dc2626;
      box-shadow:0 0 0 3px rgba(220,38,38,0.1);
    }
    .pin-hint{
      font-size:12px;color:#737373;margin-top:6px;
      display:flex;gap:6px;align-items:center;
    }
    .submit-btn{
      width:100%;padding:14px;
      background:linear-gradient(135deg,#dc2626,#ef4444);
      border:none;border-radius:10px;
      color:white;font-size:16px;font-weight:600;
      display:flex;align-items:center;justify-content:center;gap:8px;
      cursor:pointer;transition:0.2s;
    }
    .submit-btn:hover{transform:translateY(-2px);}
    .message{margin-top:16px;padding:12px;border-radius:8px;font-size:14px;display:none;}
    .message.error{
      background:#fee2e2;color:#991b1b;border:1px solid #fecaca;
      display:flex;gap:8px;
    }
    .message.success{
      background:#dcfce7;color:#166534;border:1px solid #86efac;
      display:flex;gap:8px;
    }
  </style>
</head>

<body>
<div class="register-container">
  <div class="register-card">

    <!-- HEADER -->
    <div class="register-header">
      <div class="logo-icon"><i class="fa-solid fa-user-plus"></i></div>
      <h1>Create Account</h1>
      <p>Join HomeHeaven today</p>
    </div>

    <!-- FORM -->
    <div class="register-body">
      <form id="regForm">

        <div class="form-group">
          <label class="form-label">Username</label>
          <div class="input-wrapper">
            <input name="username" class="form-input" placeholder="Choose username" required>
            <i class="fa-solid fa-user input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-wrapper">
            <input type="email" name="email" class="form-input" placeholder="you@email.com" required>
            <i class="fa-solid fa-envelope input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Mobile Number</label>
          <div class="input-wrapper">
            <input name="phone" class="form-input" placeholder="Enter mobile number" required>
            <i class="fa-solid fa-phone input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" name="password" class="form-input" placeholder="Create password" required>
            <i class="fa-solid fa-lock input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" name="confirmPassword" class="form-input" placeholder="Confirm password" required>
            <i class="fa-solid fa-lock input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">4-Digit PIN</label>
          <div class="input-wrapper">
            <input name="pin" class="form-input" placeholder="0000-9999" maxlength="4" inputmode="numeric" required>
            <i class="fa-solid fa-key input-icon"></i>
          </div>
          <div class="pin-hint">
            <i class="fa-solid fa-circle-info"></i> Use this PIN to reset your password later
          </div>
        </div>

        <button type="submit" class="submit-btn">
          <i class="fa-solid fa-user-plus"></i>
          Create Account
        </button>

        <div id="msg" class="message"></div>
      </form>

      <p style="text-align:center;margin-top:16px;font-size:14px;">
        Already have an account? <a href="/login.html" style="color:#dc2626;font-weight:600;">Sign in</a>
      </p>
    </div>

  </div>
</div>

<script>
document.getElementById("regForm").onsubmit = async (e) => {
  e.preventDefault();

  const msg = document.getElementById("msg");
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';

  const f = new FormData(e.target);
  const pin = f.get("pin").trim();
  const pass = f.get("password");
  const confirm = f.get("confirmPassword");

  // PIN validation
  if (!/^\d{4}$/.test(pin)) {
    msg.className = "message error";
    msg.innerHTML = "<i class='fa-solid fa-circle-xmark'></i> PIN must be exactly 4 digits";
    msg.style.display = "flex";
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
    return;
  }

  // Password match validation
  if (pass !== confirm) {
    msg.className = "message error";
    msg.innerHTML = "<i class='fa-solid fa-circle-xmark'></i> Passwords do not match";
    msg.style.display = "flex";
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
    return;
  }

  const body = {
    username: f.get("username"),
    email: f.get("email"),
    phone: f.get("phone"),
    password: pass,
    confirmPassword: confirm,
    pin: pin
  };

  try {
    const res = await fetch("/auth/register", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });

    const t = await res.text();

    if (res.ok) {
      msg.className = "message success";
      msg.innerHTML = "<i class='fa-solid fa-circle-check'></i> Account created! Redirecting...";
      msg.style.display = "flex";
      setTimeout(() => window.location = "/login.html", 2000);
    } else {
      msg.className = "message error";
      msg.innerHTML = "<i class='fa-solid fa-circle-xmark'></i> " + t;
      msg.style.display = "flex";
    }

  } catch (err) {
    msg.className = "message error";
    msg.innerHTML = "<i class='fa-solid fa-circle-xmark'></i> Network error. Try again.";
    msg.style.display = "flex";
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
};
</script>

</body>
</html>
