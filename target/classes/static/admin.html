<!doctype html>
<html>
<head><meta charset="utf-8"><title>My Properties - Home Heaven</title>
<link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h1>My Properties</h1>
    <div>
      <a href="/dashboard.html">Back to Dashboard</a> | <a href="/login.html" id="logoutLink">Logout</a>
    </div>
  </div>

  <div id="results" class="grid"></div>
</div>

<script>
async function loadMyProperties() {
  try {
    const res = await fetch('/admin/my-properties');
    // If user is not authenticated or not authorized, redirect to login
    if (res.status === 401 || res.status === 403) {
      // show login prompt and redirect
      document.getElementById('results').innerHTML = '<div class="card">Please log in to view your properties. Redirecting to login...</div>';
      // redirect after a short delay
      setTimeout(()=> window.location = '/login.html', 1500);
      return;
    }
    if (!res.ok) {
      document.getElementById('results').innerHTML = '<div class="card">Error loading properties (status: ' + res.status + ')</div>';
      return;
    }
    const data = await res.json();
    const container = document.getElementById('results');
    container.innerHTML = '';
    
    if (data.length === 0) {
      container.innerHTML = '<div class="card">You have not uploaded any properties yet. <a href="/upload-property.html">Upload one now</a></div>';
      return;
    }
    
    data.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      const imgs = p.images ? p.images.split(',') : [];
      card.innerHTML = `
        <div class="property-card">
          <img src="${imgs.length ? '/uploads/' + imgs[0] : '/images/placeholder.png'}" />
          <div style="flex:1">
            <h4>${p.name || 'No title'}</h4>
            <p class="small">${p.city} • ₹${p.rent}</p>
            <p class="small">${(p.description || '').substring(0, 120)}...</p>
            <p>
              <a href="/property-details.html?id=${p.id}">View Details</a> | 
              <a href="#" onclick="deleteProperty(${p.id}, event)" style="color:red;">Delete</a>
            </p>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  } catch (err) {
    console.error('Error:', err);
    document.getElementById('results').innerHTML = '<div class="card">Error loading properties</div>';
  }
}

async function deleteProperty(propId, event) {
  event.preventDefault();
  if (!confirm('Are you sure you want to delete this property?')) {
    return;
  }
  
  try {
    const res = await fetch('/admin/property/' + propId, { method: 'DELETE' });
    const data = await res.json();
    
    if (data.success) {
      alert('Property deleted successfully');
      loadMyProperties(); // reload the list
    } else {
      alert('Error: ' + (data.message || 'Could not delete property'));
    }
  } catch (err) {
    console.error('Error:', err);
    alert('Error deleting property');
  }
}

// Load properties on page load
loadMyProperties();

document.getElementById('logoutLink').onclick = async (e) => {
  e.preventDefault();
  await fetch('/auth/logout', { method: 'POST' });
  window.location = '/login.html';
}
</script>
</body>
</html>
