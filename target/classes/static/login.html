<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Login - Home Heaven</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container { max-width: 440px; width: 100%; }

    .login-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .login-header {
      background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
      padding: 40px 32px;
      text-align: center;
      color: white;
    }

    .logo-icon {
      width: 72px; height: 72px;
      background: rgba(255,255,255,0.2);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 36px;
      backdrop-filter: blur(10px);
    }

    .login-body { padding: 40px 32px; }
    .form-group { margin-bottom: 20px; }

    .form-input {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid #e5e5e5;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
      outline: none;
    }

    .submit-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
      color: white; border: none;
      border-radius: 10px;
      font-size: 16px; font-weight: 600;
      cursor: pointer;
      display: flex; justify-content: center;
      gap: 8px; transition: all 0.2s;
    }

    .submit-btn:hover { transform: translateY(-2px); }
    .message { margin-top: 16px; display: none; padding: 12px; border-radius: 10px; }

    .error { background: #fee2e2; color: #991b1b; border-left: 5px solid #ef4444; }
    .success { background: #dcfce7; color: #166534; border-left: 5px solid #22c55e; }

  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      
      <div class="login-header">
        <div class="logo-icon"><i class="fa-solid fa-house"></i></div>
        <h1>Welcome Back</h1>
        <p>Sign in to your HomeHeaven account</p>
      </div>

      <div class="login-body">
        <form id="loginForm">

          <div class="form-group">
            <input type="text" name="username" class="form-input" placeholder="Enter your username" required>
          </div>

          <div class="form-group">
            <input type="password" name="password" class="form-input" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="submit-btn">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In
          </button>

          <div id="msg" class="message"></div>

        </form>

        <div style="margin-top: 15px; text-align:center;">
          <a href="/forgot-password.html" style="color:#dc2626; text-decoration:none;">Forgot Password?</a>
        </div>

      </div>

      <div class="register-link">
        Don't have an account? <a href="/register.html">Create one now</a>
      </div>

    </div>
  </div>

<script>
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();

  const msg = document.getElementById('msg');
  const btn = e.target.querySelector("button");

  msg.style.display = "none";
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

  const form = new FormData(e.target);
  const body = {
    username: form.get('username'),
    password: form.get('password')
  };

  const res = await fetch('/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  const text = await res.text();

  if (res.ok) {
    msg.className = "message success";
    msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> Login successful! Redirecting...';
    msg.style.display = "block";

    // check for admin username
    if (body.username === "admin" || body.username === "admin@homeheavan.com") {
      setTimeout(() => window.location = "/admin-dashboard.html", 800);
    } else {
      setTimeout(() => window.location = "/dashboard.html", 800);
    }
  } else {
    msg.className = "message error";
    msg.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> ' + text;
    msg.style.display = "block";

    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
  }
};
</script>

</body>
</html>
