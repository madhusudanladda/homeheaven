<!doctype html>
<html>
<head><meta charset="utf-8"><title>Login - Home Heaven</title>
<link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="container">
  <div class="card" style="max-width:420px;margin:0 auto">
    <h2>Login</h2>
    <form id="loginForm">
      <input name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p class="small"><a href="/register.html">Register</a> | <a href="/forgot-password.html">Forgot password?</a></p>
    <div id="msg"></div>
  </div>
</div>
<script>
document.getElementById('loginForm').onsubmit = async (e)=>{
  e.preventDefault();
  const data = new FormData(e.target);
  const body = { username: data.get('username'), password: data.get('password') };
  const res = await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(res.ok) { window.location='/dashboard.html'; } else {
    const t = await res.text();
    document.getElementById('msg').innerText = t;
  }
}
</script>
</body>
</html>
